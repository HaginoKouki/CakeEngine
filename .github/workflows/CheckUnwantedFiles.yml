# 不要ファイルが含まれていないか調べるためのGitHub Action。
name: CheckUnwantedFiles

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

env:
  UNWANTED_NAME_PATTERNS: "*.pdb *.ilk *.ncd *.suo *.log *.dmp *.zip desktop.ini dxcompiler.dll dxil.dll"
  UNWANTED_DIR_PATTERNS: "generated x64 win32 arm64 .vs bin ipch logs Dump"

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 不要なファイルとディレクトリを検索
        shell: bash
        run: |
          # パターンを配列に変換（パス名展開を防ぐ）
          read -r -a NAME_PATTERNS <<< "$UNWANTED_NAME_PATTERNS"
          read -r -a DIR_PATTERNS <<< "$UNWANTED_DIR_PATTERNS"

          # ディレクトリ条件を構築
          DIR_CONDITIONS=()
          for pattern in "${DIR_PATTERNS[@]}"; do
            if [ "${#DIR_CONDITIONS[@]}" -gt 0 ]; then
              DIR_CONDITIONS+=(-o)
            fi
            DIR_CONDITIONS+=(-iname "$pattern")
          done

          # ファイル条件を構築
          NAME_CONDITIONS=()
          for pattern in "${NAME_PATTERNS[@]}"; do
            if [ "${#NAME_CONDITIONS[@]}" -gt 0 ]; then
              NAME_CONDITIONS+=(-o)
            fi
            NAME_CONDITIONS+=(-iname "$pattern")
          done

          # 不要なファイルとディレクトリを検索
          UNWANTED_LIST=$(find . \
            -path "./.git" -prune -o \
            \( \( "${DIR_CONDITIONS[@]}" \) -type d -print -prune \) -o \
            \( \( "${NAME_CONDITIONS[@]}" \) -type f -print \))

          # 検出結果があれば失敗
          if [ -n "$UNWANTED_LIST" ]; then
            echo "::error::不要なファイルまたはディレクトリが見つかりました。"
            printf '%s\n' "$UNWANTED_LIST"
            exit 1
          fi

          echo "リポジトリはクリーンです。"
```
